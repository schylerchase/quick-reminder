name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package release assets
        run: npm run release:package

      - name: Verify tag matches manifest version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.TAG_NAME;
          const normalizedTag = tag.replace(/^v/, "");
          const version = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;

          if (normalizedTag !== version) {
            console.error(`Release tag "${tag}" does not match manifest.json version "${version}".`);
            process.exit(1);
          }

          console.log(`Release tag "${tag}" matches manifest.json version "${version}".`);
          NODE

      - name: Verify release assets
        run: |
          test -f dist/release/main.js || { echo "::error file=dist/release/main.js::main.js missing after package"; exit 1; }
          test -f dist/release/manifest.json || { echo "::error file=dist/release/manifest.json::manifest.json missing after package"; exit 1; }
          test -f dist/release/versions.json || { echo "::error file=dist/release/versions.json::versions.json missing after package"; exit 1; }
          test -f dist/release/styles.css || { echo "::error file=dist/release/styles.css::styles.css missing after package"; exit 1; }
          test -f dist/release/install-macos.command || { echo "::error file=dist/release/install-macos.command::macOS installer missing after package"; exit 1; }
          test -f dist/release/install-windows.ps1 || { echo "::error file=dist/release/install-windows.ps1::Windows installer missing after package"; exit 1; }
          test -f dist/quick-reminder.zip || { echo "::error file=dist/quick-reminder.zip::quick-reminder.zip missing after package"; exit 1; }

      - name: Collect release assets
        id: assets
        run: |
          {
            echo "files<<EOF"
            echo "dist/release/main.js"
            echo "dist/release/manifest.json"
            echo "dist/release/versions.json"
            echo "dist/release/styles.css"
            echo "dist/release/install-macos.command"
            echo "dist/release/install-windows.ps1"
            echo "dist/quick-reminder.zip"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: See the commit history for changes.
          prerelease: false
          draft: false
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
