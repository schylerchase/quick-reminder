<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Reminder Task Reminder Context QA</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
      :root {
        --background-primary: #111318;
        --background-secondary: #1b1f27;
        --background-modifier-border: #343a46;
        --background-modifier-hover: #252b35;
        --interactive-accent: #265fbf;
        --text-normal: #eef1f6;
        --text-muted: #a7afbf;
        --text-faint: #8d98aa;
        --text-accent: #8fb7ff;
        --text-success: #71d99b;
        --text-warning: #ffb75d;
        --text-error: #ff6f8a;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .qa-phone {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 12px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="theme-dark is-mobile is-phone">
    <main class="qa-phone qr-view qr-view-dashboard qr-mobile-compact-tasks" data-qa="fixture-root">
      <article class="qr-view-row qr-scraped-row qr-task-status-todo qr-mobile-task-collapsed" data-qa="linked-reminder-task">
        <div class="qr-view-row-body qr-mobile-task-toggle" role="button" tabindex="0" aria-expanded="false" aria-label="Expand task details: Follow up tomorrow 9am">
          <span class="qr-task-mobile-caret" aria-hidden="true">⌄</span>
          <div class="qr-task-badges">
            <span class="qr-task-badge qr-task-status-badge qr-task-status-todo">To Do</span>
            <span class="qr-task-badge qr-task-kind-badge">Checkbox</span>
            <span class="qr-task-badge qr-task-reminder-badge">Reminder set</span>
          </div>
          <div class="qr-view-row-text qr-task-main-text">Follow up on backup report tomorrow 9am</div>
          <div class="qr-view-row-when">Line 12</div>
        </div>
        <div class="qr-view-row-actions">
          <button class="qr-row-btn" type="button">Show</button>
          <button class="qr-row-btn" type="button">Note</button>
          <button class="qr-row-btn" type="button" disabled aria-label="Reminder already added for this task">Added</button>
        </div>
      </article>
    </main>
  </body>
</html>
