<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Reminder Capture QA</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
      :root {
        --background-primary: #111318;
        --background-secondary: #1b1f27;
        --background-modifier-border: #343a46;
        --background-modifier-hover: #252b35;
        --interactive-accent: #265fbf;
        --interactive-accent-hover: #3d72d9;
        --text-normal: #eef1f6;
        --text-muted: #a7afbf;
        --text-faint: #8d98aa;
        --text-accent: #8fb7ff;
        --text-success: #71d99b;
        --text-warning: #ffb75d;
        --text-error: #ff6f8a;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 10px;
      }

      .qa-modal-shell {
        width: min(100%, 430px);
        margin: 0 auto;
        padding: 14px;
        border-radius: 18px 18px 0 0;
        background: var(--background-primary);
        box-shadow: 0 18px 60px rgb(0 0 0 / 0.48);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="theme-dark is-mobile is-phone">
    <main class="qa-modal-shell" data-qa="fixture-root">
      <div class="qr-modal" data-qa="quick-capture">
        <div class="qr-modal-header">
          <h2>New reminder</h2>
        </div>

        <div class="qr-field">
          <label class="qr-field-label" for="qa-reminder-input">Reminder</label>
          <input
            id="qa-reminder-input"
            class="qr-input"
            type="text"
            maxlength="500"
            value="Call the client about certificate renewal tomorrow at 3pm"
          >
        </div>

        <div class="qr-preview" data-qa="capture-preview">
          <div class="qr-preview-status is-ready" aria-live="polite">Ready to create</div>
          <div class="qr-preview-row">
            <span class="qr-preview-label">Task</span>
            <span>Call the client about certificate renewal</span>
          </div>
          <div class="qr-preview-row">
            <span class="qr-preview-label">Time</span>
            <span>Tomorrow, 3:00 PM</span>
          </div>
          <div class="qr-preview-meta">Detected "tomorrow at 3pm"</div>
        </div>

        <div class="qr-modal-actions" data-qa="capture-actions">
          <button class="qr-secondary-btn" type="button">Cancel</button>
          <button class="qr-primary-btn" type="button">Create reminder</button>
        </div>
      </div>
    </main>
  </body>
</html>
